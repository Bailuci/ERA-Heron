# 修改声明（AFPL 第 2(c)(i) 条）：本文件由 Bailuci 修改。
# 日期：2026-11-25 至 2026-11-26
# 目的：CI 只检查不改源码；加入 lint、类型检查与 pull_request 检查；只在 main 上构建并提交产物；构建后运行性能基准（只警告不阻断）
# 原项目：RockingSisyphus/ERA-EfficientRollbackArchitecture，修改记录见仓库根目录的 更新日志.md
name: bundle

on:
  push:
    branches:
      - main
    paths-ignore:
      - dist/**
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JesseTG/rm@v1.0.3
        with:
          path: dist

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 10

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      # 以下只检查，不改动源码；格式化请在本地提交前运行 pnpm format
      - name: 格式检查
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: 类型检查
        run: pnpm typecheck
      - name: 测试
        run: pnpm test
      - name: 构建
        run: pnpm build && pnpm release
      # 与 tests/bench/baseline.json 比较耗时和 artifact/bundle.js 体积；退化时只出警告，不阻断
      - name: 性能基准
        continue-on-error: true
        run: pnpm bench --ci

      # 只有推送到 main（或手动运行）时才提交构建产物；pull_request 只做检查
      - name: Commit changes
        if: github.event_name != 'pull_request'
        uses: EndBug/add-and-commit@v9.1.3
        with:
          default_author: github_actions
          message: '[bot] bundle'
